<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpg" href="/club_logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poéthra Leaderboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            parchment: {
              DEFAULT: '#F5ECD7',
              dark: '#E8DDBE',
            },
            ink: {
              DEFAULT: '#1B2A4A',
              light: '#2A3B5A',
            },
            oxblood: {
              DEFAULT: '#6B1C2A',
              light: '#8B2C3A',
            }
          },
          fontFamily: {
            sans: ['Literata', 'serif'],
            serif: ['Petrona', 'serif'],
            display: ['Petrona', 'serif'],
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,100..900;1,100..900&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Literata', serif;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6,
    .font-display {
      font-family: 'Petrona', serif;
    }

    .bg-parchment-texture {
      background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
    }

    /* Custom styles for Winners Page */
    .perspective-1000 {
      perspective: 1000px;
    }

    .transform-style-preserve-3d {
      transform-style: preserve-3d;
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.8s ease-out forwards;
    }

    @keyframes pulse-slow {

      0%,
      100% {
        opacity: 0.5;
        transform: scale(1);
      }

      50% {
        opacity: 0.7;
        transform: scale(1.05);
      }
    }

    .animate-pulse-slow {
      animation: pulse-slow 8s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .animate-delay-100 { animation-delay: 100ms; }
    .animate-delay-200 { animation-delay: 200ms; }
    .animate-delay-300 { animation-delay: 300ms; }
    .animate-delay-400 { animation-delay: 400ms; }
    .animate-delay-500 { animation-delay: 500ms; }

    .bg-gradient-radial {
      background-image: radial-gradient(var(--tw-gradient-stops));
    }

    .duo-fire {
      transform-origin: center bottom;
      animation: fireMain 1.6s ease-in-out infinite;
    }

    .flame-outer,
    .flame-inner {
      transform-origin: center bottom;
    }

    /* Main shared flame motion */
    @keyframes fireMain {
      0% {
        transform: translateY(0) scale(1, 1);
      }

      25% {
        transform: translateY(-1px) scale(1.03, 0.97);
      }

      50% {
        transform: translateY(-2px) scale(0.98, 1.04);
      }

      75% {
        transform: translateY(-1px) scale(1.02, 0.98);
      }

      100% {
        transform: translateY(0) scale(1, 1);
      }
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-stone-100 dark:bg-gray-900 text-stone-800 dark:text-white transition-colors duration-500">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
